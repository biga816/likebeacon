name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Verify release JAR licenses
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version=//p' gradle.properties)"
          shadow_jar="build/libs/LikeBeacon-$version.jar"

          test -f "$shadow_jar" || {
            echo "::error::Shadow JAR was not created at $shadow_jar."
            exit 1
          }

          for required_file in \
            META-INF/LICENSE \
            META-INF/THIRD_PARTY_NOTICES.md \
            META-INF/maven/org.xerial/sqlite-jdbc/LICENSE \
            META-INF/maven/org.xerial/sqlite-jdbc/LICENSE.zentus
          do
            jar --list --file "$shadow_jar" | grep -Fxq "$required_file" || {
              echo "::error::Shadow JAR does not contain $required_file."
              exit 1
            }
          done
