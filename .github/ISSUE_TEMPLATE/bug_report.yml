name: Bug Report
description: Report a reproducible problem with LikeBeacon.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before reporting a bug, please review the README's Troubleshooting section.

  - type: input
    id: likebeacon-version
    attributes:
      label: LikeBeacon version
      description: Which version of LikeBeacon are you using?
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: paper-minecraft-version
    attributes:
      label: Paper / Minecraft version
      description: Paste the output of `/version`.
      placeholder: "Paper 1.21.4 build XXX"
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java version
      description: Paste the version shown by `java -version`.
      placeholder: "OpenJDK 21.0.x"
    validations:
      required: true

  - type: textarea
    id: installed-plugins
    attributes:
      label: Installed plugins
      description: Paste the output of `/plugins`. This is required to identify chat-plugin and other compatibility conflicts.
      placeholder: "Plugin1, Plugin2, LikeBeacon"
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: List the exact steps that consistently reproduce the problem.
      placeholder: |
        1. Start the server with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: relevant-logs
    attributes:
      label: Relevant logs / stack trace
      description: Paste the relevant section of `logs/latest.log` or any stack trace. Remove secrets and sensitive data first.
      render: text

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context / config
      description: Add relevant `config.yml` content, screenshots, or any other useful context. Remove secrets and sensitive data first.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I confirmed that this problem occurs on the latest LikeBeacon release.
          required: true
        - label: I reviewed the README's Troubleshooting section.
          required: true
        - label: I searched existing Issues and found no duplicate.
          required: true
    validations:
      required: true
