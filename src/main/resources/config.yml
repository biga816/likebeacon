# Identifier used to separate Like data between servers.
server-id: default

limits:
  dailyDirectLikeLimit: 20
  pairCooldownSeconds: 60

recent:
  bufferSize: 100

reason:
  maxLength: 48

item:
  prefix: "[LIKE]"

effects:
  enabled: true

chat:
  enabled: true
  minLength: 5
  pendingBufferSize: 30
  maxStoredLength: 100
