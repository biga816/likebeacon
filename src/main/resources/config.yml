# Identifier used to separate Like data between servers.
server-id: default

limits:
  dailyDirectLikeLimit: 20
  pairCooldownSeconds: 60

recent:
  bufferSize: 100

reason:
  maxLength: 48

item:
  # Optional prefix for Like announcements and received notifications.
  prefix: ""
  # /like log always shows display codes regardless of this setting.
  showDisplayCode: false

effects:
  enabled: true

notifications:
  reactionAggregation:
    enabled: true
    # Send after this many seconds without another Like on the same item.
    quietSeconds: 3
    # Always send by this many seconds after the first Like in the batch.
    maxWaitSeconds: 10
  milestones:
    enabled: true
    # Minimum seconds between server-wide milestone announcements.
    # Announcements inside this interval are skipped; the author is still notified.
    minIntervalSeconds: 30
    item:
      # Announce when an item's Like count reaches exactly one of these values (2 or more).
      thresholds: [3, 10, 30]
      # Direct Likes are already announced when created; skip thresholds below this value for them.
      directMinThreshold: 10
      # Do not announce items older than this many hours (0 = no limit).
      maxItemAgeHours: 24

chat:
  enabled: true
  minLength: 5
  pendingBufferSize: 30
  # Clamped to 1-100 user-perceived characters. Line-breaking controls are stored as spaces.
  maxStoredLength: 100
