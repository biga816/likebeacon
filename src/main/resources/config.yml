# Identifier used to separate Like data between servers.
server-id: default

limits:
  dailyDirectLikeLimit: 20
  pairCooldownSeconds: 60

recent:
  bufferSize: 100

reason:
  maxLength: 48

item:
  prefix: "[LIKE]"
  # /like log always shows display codes regardless of this setting.
  showDisplayCode: false

effects:
  enabled: true

notifications:
  reactionAggregation:
    enabled: true
    # Send after this many seconds without another Like on the same item.
    quietSeconds: 3
    # Always send by this many seconds after the first Like in the batch.
    maxWaitSeconds: 10

chat:
  enabled: true
  minLength: 5
  pendingBufferSize: 30
  maxStoredLength: 100
